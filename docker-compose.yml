services:
  regard:
    build:
      context: .
      dockerfile: Dockerfile
    image: chibicitiberiu/regard:latest
    restart: unless-stopped
    ports:
      - "8999:8080"
    environment:
      # Jellyfin/Kodi metadata export (NFO + poster/thumb + "SxxExx - Title" naming). Optional.
      - Metadata__Enabled=true
      # Jellyfin watched-sync — optional. Fill in and flip Enabled to true to use it.
      # - Jellyfin__Enabled=true
      # - Jellyfin__BaseUrl=http://jellyfin:8096
      # - Jellyfin__ApiKey=CHANGEME
      # - Jellyfin__JellyfinUser=me
      # - Jellyfin__RegardUser=me
    volumes:
      - regard-data:/data
      # Database snapshots default to /data/Backups — i.e. inside the same volume as the database
      # they protect, so `docker volume rm regard-data` would take both. Uncomment to keep them on
      # the host instead. Same ownership rule as the downloads mount below:
      #   mkdir -p /srv/regard/backups && sudo chown 1000:1000 /srv/regard/backups
      # - /srv/regard/backups:/data/Backups
      # Videos. Mount this SAME host path into Jellyfin at the SAME container path (/downloads)
      # and point a Jellyfin "Shows" library at it — Regard matches played videos by full file
      # path. The host dir must be writable by uid 1000 (a bind mount keeps host ownership):
      #   mkdir -p /srv/regard/downloads && sudo chown 1000:1000 /srv/regard/downloads
      - /srv/regard/downloads:/downloads

  # Jellyfin, sharing the SAME downloads path at the SAME mount point:
  # jellyfin:
  #   image: jellyfin/jellyfin:latest
  #   restart: unless-stopped
  #   ports:
  #     - "8096:8096"
  #   volumes:
  #     - /srv/regard/downloads:/downloads:ro   # add a "Shows" library pointing at /downloads

volumes:
  regard-data:
